<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Aster</title>
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
<link rel="icon" type="image/png" sizes="32x32" href="icon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#14121f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Aster">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#14121f;
    --bg-elev:#1c1930;
    --bg-elev-2:#252140;
    --accent:#e8a854;
    --accent-dim: #a97e46;
    --accent-soft:rgba(232,168,84,0.09);
    --sage:#7fa88f;
    --sage-soft:rgba(127,168,143,0.10);
    --text:#f2efe9;
    --muted:#9b93a8;
    --muted-2:#6f6884;
    --border:rgba(242,239,233,0.09);
    --danger:#d9756a;
    --radius:18px;
  }
  *{box-sizing:border-box;touch-action:manipulation;}
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.001ms !important;animation-iteration-count:1 !important;transition-duration:0.001ms !important;}
  }
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);}
  body{
    font-family:'Manrope',sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    display:flex;justify-content:center;
  }
  #app{
    width:100%;max-width:480px;min-height:100vh;
    display:flex;flex-direction:column;position:relative;
    background:radial-gradient(ellipse at top, #201c37 0%, var(--bg) 55%);
  }
  h1,h2,h3,.serif{font-family:'Fraunces',serif;font-weight:500;letter-spacing:0.2px;}
  .screen{flex:1;padding:15px 14px 96px;animation:fadeIn .35s ease;font-size:13.5px;line-height:1.48;}
  body{line-height:1.6;}
  @keyframes fadeIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}
  ::selection{background:var(--accent-soft);}

  /* Top bar */
  .topbar{display:flex;align-items:center;justify-content:space-between;padding:16px 18px 4px;}
  .topbar .greet{font-size:13px;color:var(--muted);}
  .level-pill{display:flex;align-items:center;gap:6px;background:var(--bg-elev);border:1px solid var(--border);
    padding:6px 12px;border-radius:100px;font-size:12.5px;color:var(--accent);}
  .level-pill .dot{width:6px;height:6px;border-radius:50%;background:var(--accent);}

  /* Bottom nav */
  .navbar{
    position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;
    background:rgba(20,18,31,0.9);backdrop-filter:blur(14px);
    border-top:1px solid var(--border);
    display:flex;padding:8px 6px calc(8px + env(safe-area-inset-bottom));
  }
  .navbtn{
    flex:1;background:none;border:none;color:var(--muted-2);display:flex;flex-direction:column;
    align-items:center;gap:4px;font-family:'Manrope';font-size:11px;padding:6px 0;cursor:pointer;
    transition:color .2s;
  }
  .navbtn.active{color:var(--accent);}
  .navbtn svg{width:20px;height:20px;}

  /* Cards */
  .card{background:var(--bg-elev);border:1px solid var(--border);border-radius:var(--radius);padding:14px 15px;margin-bottom:10px;}
  .card h3{margin:0 0 8px;font-size:14px;line-height:1.3;}
  .muted{color:var(--muted);font-size:12.5px;line-height:1.48;}
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
    background:var(--accent);color:#1c1406;border:none;border-radius:12px;
    padding:12px 18px;font-family:'Manrope';font-weight:700;font-size:14px;cursor:pointer;
    transition:transform .12s, opacity .12s;
  }
  .btn:active{transform:scale(0.97);}
  .btn.ghost{background:transparent;color:var(--text);border:1px solid var(--border);font-weight:600;}
  .btn.sage{background:var(--sage);color:#0f1d16;}
  .btn.small{padding:8px 14px;font-size:12.5px;border-radius:10px;}
  .btn:disabled{opacity:.45;pointer-events:none;}
  .row{display:flex;gap:7px;flex-wrap:wrap;}
  .chip{
    background:var(--bg-elev-2);border:1px solid var(--border);border-radius:100px;
    padding:7px 12px;font-size:11.5px;cursor:pointer;color:var(--text);transition:all .15s;
  }
  .chip.selected{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);}
  textarea,input[type=text],select{
    width:100%;background:var(--bg-elev-2);border:1px solid var(--border);border-radius:11px;
    color:var(--text);font-family:'Manrope';font-size:16px;line-height:1.4;padding:10px 12px;resize:none;
  }
  select{-webkit-appearance:none;appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%239b93a8' stroke-width='2'><path d='M6 9l6 6 6-6'/></svg>");background-repeat:no-repeat;background-position:right 12px center;background-size:16px;}
  textarea:focus,input:focus,select:focus{outline:none;border-color:var(--accent-dim);}

  /* Room */
  .room-wrap{border-radius:18px;overflow:hidden;border:1px solid var(--border);margin-bottom:12px;position:relative;
    box-shadow:0 8px 18px rgba(0,0,0,.25), inset 0 0 24px rgba(0,0,0,.15);}
  .room-wrap svg{display:block;width:100%;height:auto;}
  .room-obj{cursor:pointer;}
  .room-caption{position:absolute;bottom:10px;left:0;right:0;text-align:center;font-size:11px;color:rgba(242,239,233,0.55);}

  /* Chat */
  .chat-log{display:flex;flex-direction:column;gap:9px;padding-bottom:14px;}
  .bubble{max-width:82%;padding:10px 13px;border-radius:15px;font-size:13.5px;line-height:1.46;}
  .bubble.me{align-self:flex-end;background:var(--accent-soft);border:1px solid rgba(232,168,84,.3);border-bottom-right-radius:4px;}
  .bubble.ai{align-self:flex-start;background:var(--bg-elev);border:1px solid var(--border);border-bottom-left-radius:4px;font-family:'Fraunces';font-weight:400;}
  .chat-input-bar{position:fixed;bottom:76px;left:50%;transform:translateX(-50%);width:100%;max-width:480px;
    padding:10px 14px;background:linear-gradient(to top, var(--bg) 60%, transparent);display:flex;gap:8px;}
  .chat-input-bar input{flex:1;}
  .typing{display:flex;gap:4px;align-self:flex-start;padding:4px 8px;}
  .typing span{width:6px;height:6px;background:var(--muted-2);border-radius:50%;animation:bounce 1.2s infinite;}
  .typing span:nth-child(2){animation-delay:.15s;}
  .typing span:nth-child(3){animation-delay:.3s;}
  @keyframes bounce{0%,60%,100%{transform:translateY(0);opacity:.4;}30%{transform:translateY(-4px);opacity:1;}}

  /* Quest list */
  .quest{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--border);}
  .quest:last-child{border-bottom:none;}
  .quest .qtype{font-size:10.5px;text-transform:uppercase;letter-spacing:0.6px;color:var(--sage);}
  .quest .qtitle{font-size:14.5px;margin-top:2px;}
  .quest.done .qtitle{text-decoration:line-through;color:var(--muted-2);}
  .qcheck{width:22px;height:22px;border-radius:50%;border:2px solid var(--muted-2);flex-shrink:0;cursor:pointer;
    display:flex;align-items:center;justify-content:center;}
  .qcheck.done{background:var(--sage);border-color:var(--sage);}
  .qcheck.done::after{content:'✓';font-size:12px;color:#0f1d16;}
  .qactions{margin-left:auto;display:flex;gap:6px;}
  .icon-btn{background:none;border:none;color:var(--muted-2);font-size:12px;cursor:pointer;padding:4px;}

  /* misc */
  .barwrap{margin-bottom:14px;}
  .barwrap .label{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);margin-bottom:5px;}
  .bar-bg{height:7px;background:var(--bg-elev-2);border-radius:100px;overflow:hidden;}
  .bar-fill{height:100%;background:linear-gradient(90deg,var(--sage),var(--accent));border-radius:100px;transition:width .5s ease;}
  .banner{background:var(--sage-soft);border:1px solid rgba(127,168,143,.35);border-radius:14px;padding:13px 15px;margin-bottom:14px;font-size:13.5px;}
  .mood-row{display:flex;gap:8px;margin:10px 0 16px;}
  .mood-btn{flex:1;background:var(--bg-elev-2);border:1px solid var(--border);border-radius:12px;padding:10px 4px;
    font-size:12px;color:var(--muted);cursor:pointer;text-align:center;}
  .mood-btn.selected{border-color:var(--accent);color:var(--accent);background:var(--accent-soft);}
  .empty{text-align:center;padding:36px 10px;color:var(--muted);}
  .empty .serif{font-size:17px;color:var(--text);margin-bottom:6px;}
  a.link{color:var(--accent);text-decoration:none;font-weight:600;font-size:13px;cursor:pointer;}
  .obj-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .obj-card{background:var(--bg-elev);border:1px solid var(--border);border-radius:14px;padding:14px;cursor:pointer;}
  .obj-card .t{font-size:13.5px;font-weight:700;margin-bottom:2px;}
  .obj-card .s{font-size:11.5px;color:var(--muted);}
  .loader{display:flex;justify-content:center;padding:30px 0;color:var(--muted);font-size:13px;}

  /* micro-interactions */
  .qcheck{transition:transform .18s ease, background .18s ease;}
  .qcheck.pulse{animation:qpulse .4s ease;}
  @keyframes qpulse{0%{transform:scale(1);}40%{transform:scale(1.35);}100%{transform:scale(1);}}
  .toast-wrap{position:fixed;top:14px;left:50%;transform:translateX(-50%);width:100%;max-width:440px;z-index:50;
    display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;padding:0 18px;}
  .toast{background:var(--bg-elev-2);border:1px solid var(--border);border-radius:100px;padding:9px 16px;
    font-size:12.5px;color:var(--accent);box-shadow:0 8px 24px rgba(0,0,0,.35);animation:toastIn .35s ease, toastOut .4s ease 2.2s forwards;}
  @keyframes toastIn{from{opacity:0;transform:translateY(-8px);}to{opacity:1;transform:none;}}
  @keyframes toastOut{to{opacity:0;transform:translateY(-6px);}}
  .levelup-overlay{position:fixed;inset:0;background:rgba(10,9,17,.72);backdrop-filter:blur(6px);
    display:flex;align-items:center;justify-content:center;z-index:60;animation:fadeIn .3s ease;}
  .levelup-card{background:var(--bg-elev);border:1px solid var(--border);border-radius:22px;padding:32px 26px;
    text-align:center;max-width:320px;animation:levelPop .45s cubic-bezier(.2,1.4,.4,1);}
  @keyframes levelPop{from{transform:scale(.85);opacity:0;}to{transform:scale(1);opacity:1;}}
  .levelup-glow{width:64px;height:64px;border-radius:50%;background:radial-gradient(circle,var(--accent),transparent 70%);
    margin:0 auto 16px;}
  .quote-card{padding:14px 14px 12px;text-align:center;position:relative;}
  .quote-card .qmark{font-family:'Fraunces';font-size:24px;color:var(--accent);opacity:.5;line-height:0.5;display:block;margin-bottom:5px;}
  .quote-card .qtext{font-family:'Fraunces';font-size:15px;line-height:1.45;color:var(--text);font-weight:500;}
  .settings-row{display:flex;align-items:center;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--border);}
  .settings-row:last-child{border-bottom:none;}
  .switch{width:42px;height:24px;border-radius:100px;background:var(--bg-elev-2);border:1px solid var(--border);
    position:relative;cursor:pointer;flex-shrink:0;}
  .switch.on{background:var(--sage-soft);border-color:var(--sage);}
  .switch::after{content:'';position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:var(--muted-2);transition:transform .18s ease, background .18s ease;}
  .switch.on::after{transform:translateX(18px);background:var(--sage);}
  .safety-banner{background:rgba(217,117,106,0.12);border:1px solid rgba(217,117,106,.4);border-radius:14px;padding:14px 15px;font-size:13.5px;line-height:1.55;}
  .safety-banner a{color:var(--accent);}

  /* bookshelf */
  .shelf{display:flex;align-items:flex-end;gap:6px;overflow-x:auto;padding:14px 4px 14px;
    border-bottom:6px solid #3c2f21;margin-bottom:14px;}
  .book-spine{flex-shrink:0;width:28px;border-radius:4px 4px 2px 2px;display:flex;align-items:flex-end;
    justify-content:center;padding-bottom:8px;cursor:pointer;box-shadow:inset -3px 0 6px rgba(0,0,0,.28);
    transition:transform .15s ease;}
  .book-spine:hover, .book-spine:active{transform:translateY(-5px);}
  .book-spine .label{writing-mode:vertical-rl;transform:rotate(180deg);font-size:10px;font-weight:700;
    white-space:nowrap;overflow:hidden;max-height:90%;}

  /* garden / collect */
  .shard-bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
  .shard-pill{display:flex;align-items:center;gap:6px;background:var(--bg-elev-2);border:1px solid var(--border);
    padding:7px 13px;border-radius:100px;font-size:13px;color:var(--accent);}
  .dig-plot{background:var(--bg-elev-2);border:1px dashed var(--border);border-radius:16px;
    padding:26px 16px;text-align:center;margin-bottom:14px;}
  .dig-result{min-height:56px;display:flex;align-items:center;justify-content:center;margin-bottom:14px;}
  .dig-found{animation:levelPop .4s cubic-bezier(.2,1.4,.4,1);}
  .dig-calm{color:var(--muted);font-size:13.5px;font-style:italic;animation:fadeIn .5s ease;}
  .dig-revealing{color:var(--muted-2);font-size:13px;}
  .garden-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;padding:10px 4px 14px;}
  .garden-tile{aspect-ratio:1;background:#2a2440;border:6px solid #4a3f68;border-radius:6px;
    display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative;
    box-shadow:0 4px 10px rgba(0,0,0,.3), inset 0 0 0 2px rgba(0,0,0,.25);}
  .garden-tile::before{content:'';position:absolute;top:-9px;left:50%;transform:translateX(-50%);
    width:4px;height:4px;border-radius:50%;background:#6f6884;}
  .garden-tile .glyph{font-size:24px;filter:drop-shadow(0 2px 3px rgba(0,0,0,.4));}
  .inv-row{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 10px;}
  .inv-item{flex-shrink:0;background:var(--bg-elev-2);border:1px solid var(--border);border-radius:12px;
    padding:10px 12px;text-align:center;cursor:pointer;min-width:64px;}
  .inv-item .glyph{font-size:22px;display:block;margin-bottom:4px;}
  .inv-item .count{font-size:11px;color:var(--muted);}
  .picker-overlay{position:fixed;inset:0;background:rgba(10,9,17,.75);backdrop-filter:blur(6px);
    display:flex;align-items:flex-end;justify-content:center;z-index:55;}
  .picker-sheet{width:100%;max-width:480px;background:var(--bg-elev);border-radius:22px 22px 0 0;
    padding:20px 18px calc(24px + env(safe-area-inset-bottom));animation:levelPop .3s ease;}

  /* calm */
  .breath-circle{width:150px;height:150px;border-radius:50%;
    background:radial-gradient(circle,var(--sage-soft),transparent 72%);border:2px solid var(--sage);
    margin:26px auto 18px;animation:breathe 8s ease-in-out infinite;}
  @keyframes breathe{0%,100%{transform:scale(0.68);opacity:.55;}50%{transform:scale(1.18);opacity:1;}}
  .silence-dot{width:16px;height:16px;border-radius:50%;background:var(--muted-2);margin:60px auto;
    animation:silencepulse 6s ease-in-out infinite;}
  @keyframes silencepulse{0%,100%{opacity:.25;transform:scale(1);}50%{opacity:.7;transform:scale(1.6);}}
  .calm-prompt-text{font-family:'Fraunces';font-size:18px;line-height:1.6;text-align:center;min-height:110px;
    display:flex;align-items:center;justify-content:center;padding:10px 6px;animation:fadeIn .6s ease;}
  .calm-timer{text-align:center;color:var(--muted);font-size:12.5px;margin-top:6px;}

  /* focus mode */
  .focus-overlay{position:fixed;inset:0;background:var(--bg);z-index:70;display:flex;flex-direction:column;
    padding:26px 22px calc(26px + env(safe-area-inset-bottom));animation:fadeIn .3s ease;}
  .focus-step{flex:1;display:flex;flex-direction:column;justify-content:center;text-align:center;}
  .focus-dots{display:flex;justify-content:center;gap:6px;margin-bottom:20px;}
  .focus-dots span{width:6px;height:6px;border-radius:50%;background:var(--border);}
  .focus-dots span.active{background:var(--accent);}

  /* title screen */
  .title-screen{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:40px 28px;position:relative;overflow:hidden;
    background:radial-gradient(ellipse at 50% 30%, #241f3e 0%, #14121f 65%);animation:fadeIn .6s ease;}
  .title-stars{position:absolute;inset:0;pointer-events:none;}
  .title-wordmark{font-family:'Fraunces';font-size:36px;font-weight:500;letter-spacing:1px;
    color:var(--text);margin-bottom:8px;animation:titleRise .8s ease;}
  .title-glow{width:56px;height:56px;border-radius:50%;margin-bottom:18px;
    background:radial-gradient(circle,var(--accent) 0%,transparent 72%);opacity:.7;
    animation:titlePulse 3.5s ease-in-out infinite;}
  @keyframes titlePulse{0%,100%{transform:scale(1);opacity:.7;}50%{transform:scale(1.12);opacity:1;}}
  @keyframes titleRise{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}
  .title-tagline{color:var(--muted);font-size:14px;line-height:1.55;max-width:230px;margin:0 auto 34px;}
  .title-welcome{font-family:'Fraunces';font-size:22px;margin-bottom:8px;}
  .pet-idle{animation:petBounce 2.6s ease-in-out infinite;}
  @keyframes petBounce{0%,100%{transform:translateY(0);}50%{transform:translateY(-4px);}}
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ============ STORAGE ============ */
const STORE_KEY = 'aster-state-v1';
let state = null;

function defaultState(){
  return {
    onboarded:false,
    onboardStep:0,
    onboardAnswers:{},
    profile:{ name:'', priorities:'', challenges:'', goodThings:'' },
    companion:{ name:'Otterly', personality:'Calm', communication:'conversational', avatar:{ color:'amber', species:'otter', accessory:'none' } },
    xp:{ Courage:0, Consistency:0, Growth:0, Connection:0, Adventure:0, Learning:0, Care:0, Creativity:0 },
    quests:[],
    journal:[],
    chat:[],
    dailyCheckIn:null, // {date, mood, mind}
    dailyPlan:null, // {date, items:[{id,label,title,status}]}
    activeDates:[],
    lastOpened:null,
    firstQuestDone:false,
    settings:{ sound:true, music:false, notifyMorning:true, notifyEvening:true, quietStart:22, quietEnd:7, defaultSpace:'room', apiKey:'' },
    skipLog:[], // dates something was skipped, for adaptive difficulty
    completeLog:[], // dates something was completed
    eveningReflections:[],
    seenLevel:1,
    lastQuoteDate:null,
    lastQuoteIdx:null,
    chatSummary:'',
    inventory:{ shards:0, items:{} }, // items: {itemId: count owned}
    garden:[null,null,null,null,null,null], // placed item ids, grows with level
    digsToday:{ date:null, used:0 },
    puzzle:{ index:1, pieces:Array(9).fill(false), foundNotPlaced:[], completed:[] },
    pinnedItem:null,
    tutorialSeen:false,
    puzzleUnlockedSpaces:[],
    lastQuestPopupDate:null,
    snapshots:[],
    moodHistory:[]
  };
}

/* Storage abstraction: uses window.storage inside Claude.ai artifacts,
   falls back to localStorage on any other host (e.g. GitHub Pages) so
   progress persists there too. */
async function storageGet(key){
  if(window.storage && typeof window.storage.get === 'function'){
    return window.storage.get(key, false);
  }
  try{
    const v = localStorage.getItem(key);
    return v !== null ? { value: v } : null;
  }catch(e){ return null; }
}
async function storageSet(key, value){
  if(window.storage && typeof window.storage.set === 'function'){
    return window.storage.set(key, value, false);
  }
  try{
    localStorage.setItem(key, value);
    return { value };
  }catch(e){ return null; }
}

async function loadState(){
  try{
    const r = await storageGet(STORE_KEY);
    state = r ? JSON.parse(r.value) : defaultState();
  }catch(e){
    state = defaultState();
  }
  if(!state.companion) state = Object.assign(defaultState(), state);
  if(!state.companion.avatar) state.companion.avatar = { color:'amber', species:'otter', accessory:'none' };
  if(!state.companion.avatar.species) state.companion.avatar.species = 'otter';
  if(!state.inventory) state.inventory = { shards:0, items:{} };
  if(!state.garden) state.garden = [null,null,null,null,null,null];
  if(!state.puzzle) state.puzzle = { index:1, pieces:Array(9).fill(false), foundNotPlaced:[], completed:[] };
  if(!state.puzzle.foundNotPlaced) state.puzzle.foundNotPlaced = [];
  if(state.pinnedItem === undefined) state.pinnedItem = null;
  if(state.tutorialSeen === undefined) state.tutorialSeen = true;
  if(state.settings.music === undefined) state.settings.music = false;
  if(state.chatSummary === undefined) state.chatSummary = '';
  if(!state.puzzleUnlockedSpaces) state.puzzleUnlockedSpaces = [];

function levelThreshold(lvl){ return 22 + (lvl-1)*14; }

  let remaining = totalXP(), lvl = 1, need = levelThreshold(1);
  while(remaining >= need){ remaining -= need; lvl++; need = levelThreshold(lvl); }
  const names = ['Arrival','Explorer','Builder','Challenger','Voyager','Sage','Wayfinder'];
  const name = names[Math.min(lvl-1, names.length-1)];
  return { lvl, name, into:remaining, need };
}

let audioCtx;
function playChime(kind){
  if(!state.settings.sound) return;
  try{
    if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
    const notes = kind==='level' ? [523.25,659.25,783.99,1046.5] : [659.25,987.77];
    notes.forEach((f,i)=>{
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type='sine'; o.frequency.value=f;
      const t0 = audioCtx.currentTime + i*0.08;
      g.gain.setValueAtTime(0, t0);
      g.gain.linearRampToValueAtTime(0.09, t0+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t0+0.5);
      o.connect(g); g.connect(audioCtx.destination);
      o.start(t0); o.stop(t0+0.55);
    });
  }catch(e){ /* audio unsupported, ignore */ }
}

let musicMasterGain = null;
let musicReverbDelay = null;
let musicScheduler = null;
let musicPlaying = false;
// C major pentatonic across two octaves — every note in this set sounds
// consonant against every other, so random notes never clash.
const PIANO_SCALE = [261.63, 293.66, 329.63, 392.00, 440.00, 523.25, 587.33, 659.25];

function ensureMusicGraph(){
  if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
  if(musicMasterGain) return;
  musicMasterGain = audioCtx.createGain();
  musicMasterGain.gain.value = 0.0001;
  musicMasterGain.connect(audioCtx.destination);
  // A short feedback delay stands in for a soft room reverb, so struck
  // notes have a little air and decay around them instead of sounding dry.
  const delay = audioCtx.createDelay(2.0);
  delay.delayTime.value = 0.34;
  const feedback = audioCtx.createGain();
  feedback.gain.value = 0.32;
  const delayFilter = audioCtx.createBiquadFilter();
  delayFilter.type = 'lowpass'; delayFilter.frequency.value = 2200;
  delay.connect(delayFilter); delayFilter.connect(feedback); feedback.connect(delay);
  delay.connect(musicMasterGain);
  musicReverbDelay = delay;
}
function playPianoNote(freq){
  const t0 = audioCtx.currentTime;
  const noteGain = audioCtx.createGain();
  // Quick attack, slow exponential decay — the shape of a struck note,
  // not a held one. This is most of what makes it read as "piano" rather
  // than "synth pad".
  noteGain.gain.setValueAtTime(0.0001, t0);
  noteGain.gain.linearRampToValueAtTime(0.16, t0 + 0.015);
  noteGain.gain.exponentialRampToValueAtTime(0.0001, t0 + 5.5);
  const toneFilter = audioCtx.createBiquadFilter();
  toneFilter.type = 'lowpass'; toneFilter.frequency.value = 3200;
  noteGain.connect(toneFilter);
  toneFilter.connect(musicMasterGain);
  toneFilter.connect(musicReverbDelay);
  // A fundamental plus two quiet overtones gives it body instead of
  // sounding like a single flat sine wave.
  [[1,1],[2,0.22],[4,0.06]].forEach(([mult,vol])=>{
    const osc = audioCtx.createOscillator();
    osc.type = 'sine';
    osc.frequency.value = freq * mult;
    const harmGain = audioCtx.createGain();
    harmGain.gain.value = vol;
    osc.connect(harmGain);
    harmGain.connect(noteGain);
    osc.start(t0);
    osc.stop(t0 + 6);
  });
}
function startMusic(){
  if(musicPlaying) return;
  try{
    ensureMusicGraph();
    musicMasterGain.gain.cancelScheduledValues(audioCtx.currentTime);
    musicMasterGain.gain.linearRampToValueAtTime(1, audioCtx.currentTime + 1.5);
    musicPlaying = true;
    const scheduleNext = ()=>{
      if(!musicPlaying) return;
      playPianoNote(PIANO_SCALE[Math.floor(Math.random()*PIANO_SCALE.length)]);
      if(Math.random() < 0.3){
        setTimeout(()=>{
          if(musicPlaying) playPianoNote(PIANO_SCALE[Math.floor(Math.random()*PIANO_SCALE.length)]);
        }, 300 + Math.random()*500);
      }
      musicScheduler = setTimeout(scheduleNext, 2800 + Math.random()*3200);
    };
    scheduleNext();
  }catch(e){ /* audio unsupported, ignore */ }
}
function stopMusic(){
  musicPlaying = false;
  clearTimeout(musicScheduler);
  musicScheduler = null;
  if(musicMasterGain){
    try{
      musicMasterGain.gain.cancelScheduledValues(audioCtx.currentTime);
      musicMasterGain.gain.linearRampToValueAtTime(0.0001, audioCtx.currentTime + 1);
    }catch(e){}
  }
}
function toggleMusic(){
  state.settings.music = !state.settings.music;
  if(state.settings.music) startMusic(); else stopMusic();

/* ============ ADAPTIVE DIFFICULTY ============ */
function recentSkipRate(){
  const cutoff = new Date(); cutoff.setDate(cutoff.getDate()-4);
  const recentSkips = state.skipLog.filter(d=>new Date(d) >= cutoff).length;
  const recentCompletes = state.completeLog.filter(d=>new Date(d) >= cutoff).length;
  const total = recentSkips + recentCompletes;
  if(total < 3) return null; // not enough data
  return recentSkips/total;
}

/* ============ AI CALL ============ */
async function callClaude(system, messages, jsonMode=false){
  try{
    const body = {
      model:"claude-sonnet-5",
      max_tokens:1000,
      system: system + (jsonMode ? "\n\nRespond with ONLY valid JSON. No markdown, no backticks, no preamble." : ""),
      messages
    };
    const key = state.settings.apiKey;
    const headers = { "Content-Type":"application/json" };
    if(key){
      // Personal API key path — used when the app is hosted outside Claude.ai
      // (e.g. GitHub Pages), where no built-in proxy is available.
      headers["x-api-key"] = key;
      headers["anthropic-version"] = "2023-06-01";
      headers["anthropic-dangerous-direct-browser-access"] = "true";
    }
    const res = await fetch("https://api.anthropic.com/v1/messages", {
      method:"POST",
      headers,
      body: JSON.stringify(body)
    });
    const data = await res.json();
    const text = (data.content||[]).map(b=>b.text||'').join('\n').trim();
    if(jsonMode){
      const clean = text.replace(/```json|```/g,'').trim();
      return JSON.parse(clean);
    }
    return text;
  }catch(e){
    console.error("AI call failed", e);
    return jsonMode ? null : "";
  }
}

- The user is the decision-maker. You suggest, you don't command.

function completeQuest(id){
  const q = state.quests.find(x=>x.id===id);

  state.completeLog.push(todayStr());

  saveState();
}

const SPACES = [
  { id:'room',    name:'Room',    unlockLevel:1 },
  { id:'outside', name:'Outside', unlockLevel:3 },
  { id:'ocean',   name:'Ocean',   unlockLevel:6 }
];
function isSpaceUnlocked(s){
  return levelInfo().lvl >= s.unlockLevel || state.puzzleUnlockedSpaces.includes(s.id);
}
let currentSpace = null;
function ensureSpace(){
  if(!currentSpace) currentSpace = state.settings.defaultSpace || 'room';
  const s = SPACES.find(x=>x.id===currentSpace);
  if(s && !isSpaceUnlocked(s)) currentSpace = 'room';
}
function switchSpace(id){ currentSpace = id; render(); }
function trySwitchSpace(id){
  const s = SPACES.find(x=>x.id===id);
  if(s && !isSpaceUnlocked(s)){ showToast(`Unlocks at level ${s.unlockLevel} — or finish a puzzle to open it early`); return; }
  switchSpace(id);
}
function setDefaultSpace(){
  state.settings.defaultSpace = currentSpace;
  saveState();
  showToast('Set as your home screen');
}
function sceneSvg(){
  ensureSpace();
  if(currentSpace==='outside') return outsideSvg();
  if(currentSpace==='ocean') return oceanSvg();
  return roomSvg();
}

  { key:'priorities', q:"What made you open this today?", chips:["Feeling overwhelmed","Want a fresh start","Just curious","Trying to build a habit","Someone recommended it","Want to feel calmer"] },
  { key:'challenges', q:"What feels difficult right now?", chips:["Motivation","Time","Focus","Relationships","Work or money","Health","Not sure yet"] },
  { key:'goodThings', q:"What's already going well?", chips:["My health","A relationship","Work or school","A hobby","My mindset","Honestly, not much yet"] }
];
let obChipSelections = {};
let obShowFreeText = {};

function toggleObChip(key, chip){
  if(!obChipSelections[key]) obChipSelections[key] = [];
  const i = obChipSelections[key].indexOf(chip);
  if(i>-1) obChipSelections[key].splice(i,1); else obChipSelections[key].push(chip);
  renderOnboarding();
}
function toggleObFreeText(key){
  obShowFreeText[key] = !obShowFreeText[key];
  renderOnboarding();
}

function renderOnboarding(){
  const step = state.onboardStep;
  const app = document.getElementById('app');
  if(step === 0){
    app.innerHTML = `
      <div class="screen" style="display:flex;flex-direction:column;justify-content:center;min-height:92vh;">
        <div class="serif" style="font-size:14px;color:var(--muted);margin-bottom:8px;text-align:center;">Aster</div>
        <h1 class="serif" style="font-size:20px;margin-bottom:6px;text-align:center;">Pick a companion.</h1>
        <div class="muted" style="margin-bottom:18px;text-align:center;">You can change this anytime later.</div>
        <div style="text-align:center;margin-bottom:18px;">
          <svg viewBox="0 0 60 60" style="width:76px;height:76px;">${avatarMarkup(30,32,1.7)}</svg>
        </div>
        <div class="row" style="justify-content:center;">
          ${Object.entries(PET_TYPES).map(([id,p])=>`<span class="chip ${state.companion.avatar.species===id?'selected':''}" onclick="onboardPickPet('${id}')">${p.label}</span>`).join('')}
        </div>
        <div class="muted" style="margin:16px 0 8px;text-align:center;">Give them a name, or keep this one.</div>
        <input type="text" id="ob-pet-name" value="${escapeHtml(state.companion.name)}" style="text-align:center;">
        <div style="margin-top:20px;display:flex;justify-content:flex-end;">
          <button class="btn" onclick="onboardNextStep()">Continue</button>
        </div>
      </div>`;
  } else if(step-1 < ONBOARD_QUESTIONS.length){
    const q = ONBOARD_QUESTIONS[step-1];
    const selected = obChipSelections[q.key] || [];
    const showFree = !!obShowFreeText[q.key];
    app.innerHTML = `
      <div class="screen" style="display:flex;flex-direction:column;justify-content:center;min-height:92vh;">
        <div style="text-align:center;margin-bottom:28px;">
          <div class="serif" style="font-size:14px;color:var(--muted);margin-bottom:8px;">Aster · ${step} of ${ONBOARD_QUESTIONS.length}</div>
          <h1 class="serif" style="font-size:22px;line-height:1.4;margin:0;">${q.q}</h1>
          <div class="muted" style="margin-top:8px;">Tap whatever fits. As many as you like.</div>
        </div>
        <div class="row" style="justify-content:center;margin-bottom:14px;">
          ${q.chips.map(c=>`<span class="chip ${selected.includes(c)?'selected':''}" onclick="toggleObChip('${q.key}','${c.replace(/'/g,"\\'")}')">${c}</span>`).join('')}
        </div>
        <div style="text-align:center;margin-bottom:8px;">
          <a class="link" onclick="toggleObFreeText('${q.key}')">${showFree?'Hide':'Prefer to put it in your own words?'}</a>
        </div>
        ${showFree ? `<textarea id="ob-input" rows="3" placeholder="Say it your way...">${escapeHtml(state.onboardAnswers[q.key+'_free']||'')}</textarea>` : ''}
        <div style="margin-top:16px;display:flex;justify-content:flex-end;">
          <button class="btn" onclick="onboardNext()">Continue</button>
        </div>
      </div>`;
  } else if(step === ONBOARD_QUESTIONS.length+1){
    app.innerHTML = `
      <div class="screen" style="display:flex;flex-direction:column;justify-content:center;min-height:92vh;">
        <h1 class="serif" style="font-size:22px;margin-bottom:20px;">One more thing — what should I call you?</h1>
        <input type="text" id="ob-name" placeholder="Your name" value="${escapeHtml(state.profile.name)}">
        <div style="margin-top:16px;display:flex;justify-content:flex-end;">
          <button class="btn" onclick="onboardName()">Continue</button>
        </div>
      </div>`;
    document.getElementById('ob-name').focus();
  } else if(step === ONBOARD_QUESTIONS.length+2){
    app.innerHTML = `
      <div class="screen" style="display:flex;flex-direction:column;justify-content:center;min-height:92vh;">
        <div class="loader">
          <div>
            <div class="serif" style="font-size:18px;color:var(--text);margin-bottom:8px;text-align:center;">Setting up your room...</div>
            <div style="text-align:center;">This takes a moment.</div>
          </div>
        </div>
      </div>`;
    finishOnboarding();
  } else {
    // final reveal
    const first = state.quests[0];
    app.innerHTML = `
      <div class="screen title-screen" style="min-height:100vh;">
        <div class="pet-idle" style="margin-bottom:16px;">
          <svg viewBox="0 0 60 60" style="width:58px;height:58px;">${avatarMarkup(30,32,1.5)}</svg>
        </div>
        <div class="muted" style="font-size:15px;line-height:1.55;max-width:270px;margin-bottom:22px;">${escapeHtml(state.onboardWelcome || "Good to meet you.")}</div>
        ${first ? `
        <div class="card" style="width:100%;max-width:280px;text-align:center;">
          <div class="qtype">first quest</div>
          <h3 style="margin-top:4px;font-size:14.5px;">${escapeHtml(first.title)}</h3>
        </div>` : ''}
        <button class="btn" style="margin-top:18px;" onclick="beginFirstQuest()">${first ? "Let's do it" : 'Enter your room'}</button>
      </div>`;
  }
}
let onboardingFocusPending = false;
function beginFirstQuest(){
  const first = state.quests[0];
  state.lastQuestPopupDate = todayStr();
  if(first){
    onboardingFocusPending = true;
    openFocus({ id:first.id, title:first.title, xpCategory:first.xpCategory, xpAmount:first.xpAmount });
  } else {
    enterApp();
  }
}

function onboardNext(){
  const q = ONBOARD_QUESTIONS[state.onboardStep-1];
  const chips = (obChipSelections[q.key] || []).join(', ');
  const freeInput = document.getElementById('ob-input');
  const free = freeInput ? freeInput.value.trim() : '';
  if(free) state.onboardAnswers[q.key+'_free'] = free;
  const combined = [chips, free].filter(Boolean).join(' — ');
  state.onboardAnswers[q.key] = combined;
  state.profile[q.key] = combined;
  state.onboardStep++;
  saveState();
  render();
}
function onboardName(){
  const val = document.getElementById('ob-name').value.trim();
  state.profile.name = val || 'friend';
  state.onboardStep++;
  saveState();
  render();
}
function onboardPickPet(id){
  const wasDefault = Object.values(PET_TYPES).some(p=>p.defaultName===state.companion.name);
  state.companion.avatar.species = id;
  if(wasDefault) state.companion.name = PET_TYPES[id].defaultName;
  saveState();
  render();
}
function onboardNextStep(){
  const nameInput = document.getElementById('ob-pet-name');
  if(nameInput){ const v = nameInput.value.trim(); if(v) state.companion.name = v; }
  state.onboardStep++;
  saveState();
  render();
}

async function finishOnboarding(){
  const p = state.profile;
  const result = await callClaude(
    `You are ${state.companion.name}, a warm, sharp life-coach companion inside an app called Aster. A new user just answered onboarding questions. Given their answers, write:
1) A short (1-3 sentence) warm, non-cliché welcome message that reflects back something specific and true about what they said — no generic "welcome to your journey" language.
2) One immediately achievable first quest (something they could do in the next 10 minutes, related to what they said) with a title (under 10 words), an xpCategory (one of: Courage, Consistency, Growth, Connection, Adventure, Learning, Care, Creativity), and xpAmount (5-15).`,
    [{ role:'user', content: `Name: ${p.name}\nWhat brought them here: ${p.priorities}\nWhat feels difficult: ${p.challenges}\nWhat's going well: ${p.goodThings}` }],
    true
  );
  if(result && result.welcome){
    state.onboardWelcome = result.welcome || result.message;
    const quest = result.quest || result;
    addQuest(quest.title || "Take one small first step", quest.xpCategory || 'Growth', quest.xpCategory || 'Growth', quest.xpAmount || 10);
  } else {
    state.onboardWelcome = `Good to meet you, ${p.name}. Let's start small — nothing here needs to be figured out all at once.`;
    addQuest("Write down the one thing on your mind right now", 'daily', 'Growth', 10);
  }
  state.onboardStep++;
  saveState();
  render();
}

function enterApp(){
  state.onboarded = true;
  currentScreen = 'home';
  saveState();
  render();
  if(!state.tutorialSeen) setTimeout(openTutorial, 400);
}

const TUTORIAL_STEPS = [
  { title:'This is your room.', body:"Everything you can tap is a doorway — the desk opens Quests, the bookshelf opens Learn, the little companion opens Talk. The room itself grows and changes as you level up." },
  { title:'The + button', body:"Tap the plus at the bottom whenever you want to talk it out, write a journal entry, or do a quick brain dump — it's your fastest way in." },
  { title:'Today', body:"A short check-in shapes a small plan for the day — one thing for you, one for your mind, one to move life forward. Nothing is mandatory, and skipping is never a failure." },
  { title:'Quests', body:"If you don't know where to start, just ask — there's a button that suggests one small quest based on where you're at right now." },
  { title:'Garden & Calm', body:"Dig for little collectibles, build a puzzle piece by piece, and display finds on your wall. Calm is the one place with no agenda at all — just a pause." },
  { title:'Always in charge.', body:"Your companion will suggest, reflect, and occasionally push back — but every choice here is yours. Let's go." }
];
let tutorialStep = 0;
function openTutorial(){
  tutorialStep = 0;
  mountTutorial();
}
function mountTutorial(){
  let el = document.getElementById('tutorial-overlay');
  if(!el){ el = document.createElement('div'); el.className='focus-overlay'; el.id='tutorial-overlay'; document.body.appendChild(el); }
  const s = TUTORIAL_STEPS[tutorialStep];
  const isLast = tutorialStep === TUTORIAL_STEPS.length-1;
  const dots = TUTORIAL_STEPS.map((_,i)=>`<span class="${i===tutorialStep?'active':''}"></span>`).join('');
  el.innerHTML = `
    <div class="focus-dots">${dots}</div>
    <div class="focus-step">
      <div class="serif" style="font-size:17px;margin-bottom:10px;">${s.title}</div>
      <div class="muted" style="line-height:1.55;">${s.body}</div>
    </div>
    <button class="btn" onclick="${isLast?'closeTutorial()':'tutorialNext()'}">${isLast?"Let's go":'Next'}</button>
    ${!isLast ? `<button class="btn ghost small" style="margin-top:10px;" onclick="closeTutorial()">Skip</button>` : ''}
  `;
}
function tutorialNext(){ tutorialStep++; mountTutorial(); }
function closeTutorial(){
  const el = document.getElementById('tutorial-overlay');
  if(el) el.remove();
  state.tutorialSeen = true;
  saveState();
}

function maybePopFirstQuest(activeQuests){
  const today = todayStr();
  if(state.lastQuestPopupDate === today) return;
  state.lastQuestPopupDate = today;
  saveState();
  if(activeQuests && activeQuests.length){
    const top = activeQuests[0];
    setTimeout(()=>{
      openFocus({ id:top.id, title:top.title, xpCategory:top.xpCategory, xpAmount:top.xpAmount });
    }, 500);
  }
}
function renderTodaySummaryCard(){
  const today = todayStr();
  const checkedIn = state.dailyCheckIn && state.dailyCheckIn.date===today;
  const hasPlan = state.dailyPlan && state.dailyPlan.date===today;
  if(!checkedIn){
    return `<div class="card" style="text-align:center;">
      <h3 style="margin-bottom:4px;">How are you arriving today?</h3>
      <div class="muted" style="margin-bottom:10px;">A quick check-in shapes a small plan for today.</div>
      <button class="btn small" onclick="nav('today')">Check in</button>
    </div>`;
  }
  if(!hasPlan){
    return `<div class="card" style="text-align:center;">
      <div class="muted">Building today's plan...</div>
    </div>`;
  }
  const done = state.dailyPlan.items.filter(i=>i.status==='done').length;
  return `<div class="card">
    <h3 style="margin-bottom:4px;">Today</h3>
    <div class="muted" style="margin-bottom:8px;">${done} of ${state.dailyPlan.items.length} done.</div>
    <a class="link" onclick="nav('today')">View today's plan →</a>
  </div>`;
}

function renderTodayScreen(){
  renderShell(`
    <div class="topbar"><h2 style="margin:0;font-size:16.5px;">Today</h2><div></div></div>
    <div class="screen">
      ${renderDailyPlanCard()}
      ${renderSnapshotCard()}
      ${renderEveningCard()}
    </div>
  `);
}
function renderSnapshotCard(){
  const today = todayStr();
  const already = state.snapshots.find(s=>s.date===today);
  if(already){
    return `<div class="card" style="text-align:center;">
      <img src="${already.photo}" style="max-width:160px;border-radius:12px;margin-bottom:8px;">
      <div class="muted">Today's snapshot, saved.</div>
    </div>`;
  }
  if(snapshotSkippedToday) return '';
  return `<div class="card" style="text-align:center;">
    <div class="serif" style="font-size:15px;margin-bottom:6px;">Want to remember today?</div>
    <div class="muted" style="margin-bottom:10px;">One quick, totally optional photo — nothing has to look nice.</div>
    <input type="file" accept="image/*" capture="environment" id="snap-input" onchange="saveSnapshot(this)" style="margin-bottom:8px;">
    <div><a class="link" onclick="skipSnapshotToday()">Not today</a></div>
  </div>`;
}
let snapshotSkippedToday = false;
function skipSnapshotToday(){ snapshotSkippedToday = true; render(); }
function saveSnapshot(input){
  const file = input.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (ev)=>{
    const img = new Image();
    img.onload = ()=>{
      const maxW = 360;
      const scale = Math.min(1, maxW/img.width);
      const canvas = document.createElement('canvas');
      canvas.width = Math.round(img.width*scale);
      canvas.height = Math.round(img.height*scale);
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img,0,0,canvas.width,canvas.height);
      const dataUrl = canvas.toDataURL('image/jpeg', 0.6);
      state.snapshots.push({ date: todayStr(), photo: dataUrl });
      earnShards(1);
      saveState();
      render();
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
}

function renderNudgeBanner(){
  const h = new Date().getHours();
  const today = todayStr();
  if(h>=5 && h<11 && state.settings.notifyMorning && (!state.dailyCheckIn || state.dailyCheckIn.date!==today)){
    return `<div class="banner">Morning. What's today's first move?</div>`;
  }
  if(h>=18 && h<23 && state.settings.notifyEvening && !state.eveningReflections.some(r=>r.date===today) && state.dailyCheckIn && state.dailyCheckIn.date===today){
    return `<div class="banner">Before you disappear for the night — what went right today?</div>`;
  }
  return '';
}
function comebackQuest(){
  addQuest("Do one tiny thing — anything counts", 'reset', 'Consistency', 8);
  render();
}

function renderDailyPlanCard(){
  const today = todayStr();
  if(!state.dailyCheckIn || state.dailyCheckIn.date !== today){
    return `
    <div class="card">
      <h3>How are you arriving today?</h3>
      <div class="mood-row">
        ${['Great','Good','Okay','Low','Rough'].map(m=>`<button class="mood-btn" onclick="selectMood('${m}')">${m}</button>`).join('')}
      </div>
      <div id="mood-followup"></div>
    </div>`;
  }
  if(!state.dailyPlan || state.dailyPlan.date !== today){
    return `<div class="card"><h3>Building today's plan...</h3><div class="loader">One moment.</div></div>`;
  }
  const plan = state.dailyPlan;
  return `
  <div class="card">
    <h3>Today</h3>
    ${plan.items.map(it=>`
      <div class="quest ${it.status==='done'?'done':''}">
        <div class="qcheck ${it.status==='done'?'done':''}" onclick="${it.status==='done'?`togglePlanItem('${it.id}')`:`pulseThenRun(this, ()=>togglePlanItem('${it.id}'))`}"></div>
        <div>
          <div class="qtype">${it.label}</div>
          <div class="qtitle">${escapeHtml(it.title)}</div>
        </div>
        ${it.status!=='done' && it.status!=='skipped' ? `<button class="icon-btn qactions" onclick="skipPlanItem('${it.id}')">skip</button>` : ''}
      </div>
    `).join('')}
  </div>`;
}

function renderEveningCard(){
  const h = new Date().getHours();
  const today = todayStr();
  const alreadyDone = state.eveningReflections.some(r=>r.date===today);
  if(h < 18 || alreadyDone || !state.dailyCheckIn || state.dailyCheckIn.date!==today) return '';
  return `
  <div class="card">
    <h3>Before you go — how did today land?</h3>
    <textarea id="ev-well" rows="2" placeholder="What went well?" style="margin-bottom:8px;"></textarea>
    <textarea id="ev-hard" rows="2" placeholder="What was hard?" style="margin-bottom:8px;"></textarea>
    <textarea id="ev-proud" rows="2" placeholder="What are you proud of?"></textarea>
    <div style="margin-top:10px;display:flex;justify-content:flex-end;">
      <button class="btn small sage" onclick="submitEveningReflection()">Close the day</button>
    </div>
  </div>`;
}
async function submitEveningReflection(){
  const well=(document.getElementById('ev-well')||{}).value||'';
  const hard=(document.getElementById('ev-hard')||{}).value||'';
  const proud=(document.getElementById('ev-proud')||{}).value||'';
  state.eveningReflections.push({ date: todayStr(), well, hard, proud });
  state.xp.Growth += 8;
  earnShards(2);
  markActive();
  saveState();
  render();
  const result = await callClaude(
    `Based on this evening reflection from a user of Aster, suggest ONE small priority for tomorrow. Respond with JSON: {"title": "...", "xpCategory": one of Courage/Consistency/Growth/Connection/Adventure/Learning/Care/Creativity, "note": "one short warm sentence for tomorrow-them, under 20 words, no cliches"}.`,
    [{ role:'user', content:`Went well: ${well}. Was hard: ${hard}. Proud of: ${proud}` }],
    true
  );
  if(result && result.title){
    addQuest(result.title, 'daily', result.xpCategory||'Growth', 10);
    if(result.note) showToast(result.note);
  }
  saveState();
  render();
}
const EMOTION_WORDS = {
  Great: ['Excited','Proud','Grateful','Peaceful','Energized'],
  Good:  ['Content','Hopeful','Curious','Relieved','Warm'],
  Okay:  ['Neutral','Tired','Restless','Distracted','Flat'],
  Low:   ['Sad','Lonely','Discouraged','Numb','Drained'],
  Rough: ['Anxious','Overwhelmed','Angry','Hopeless','Scared']
};
let selectedEmotion = '';
function selectMood(mood){
  selectedEmotion = '';
  document.getElementById('mood-followup').innerHTML = `
    <div style="margin-top:6px;">
      <div class="muted" style="margin-bottom:8px;">Want to get more specific? Naming it precisely tends to help more than a general mood.</div>
      <div class="row" style="margin-bottom:14px;">
        ${(EMOTION_WORDS[mood]||[]).map(w=>`<span class="chip" id="emo-${w}" onclick="selectEmotion('${w}')">${w}</span>`).join('')}
      </div>
      <div class="muted" style="margin-bottom:8px;">What's taking up the most space in your head?</div>
      <textarea id="mood-text" rows="2" placeholder="Anything, or leave blank"></textarea>
      <div style="margin-top:10px;display:flex;justify-content:flex-end;">
        <button class="btn small" onclick="submitCheckIn('${mood}')">Start the day</button>
      </div>
    </div>`;
}
function selectEmotion(w){
  selectedEmotion = selectedEmotion===w ? '' : w;
  document.querySelectorAll('[id^="emo-"]').forEach(el=>el.classList.remove('selected'));
  if(selectedEmotion) document.getElementById('emo-'+w).classList.add('selected');
}

async function submitCheckIn(mood){
  const mind = (document.getElementById('mood-text')||{}).value || '';
  state.dailyCheckIn = { date: todayStr(), mood, mind, emotion: selectedEmotion };
  if(!state.moodHistory) state.moodHistory = [];
  state.moodHistory = state.moodHistory.filter(m=>m.date!==todayStr());
  state.moodHistory.push({ date: todayStr(), mood, emotion: selectedEmotion });
  if(state.moodHistory.length>60) state.moodHistory = state.moodHistory.slice(-60);
  saveState();
  render();
  const skipRate = recentSkipRate();
  const result = await callClaude(
    `You generate one day's plan for a user of Aster, a personal-development app. Given their check-in, produce a JSON object with an "items" array of exactly 4 objects (unless mood is Low/Rough, then 3), each with: "label" (one of: "For you","For your mind","Move life forward","For someone else"), and "title" (a single small, concrete, doable-today action, under 14 words, specific — never abstract advice). If mood is Low or Rough, make everything smaller and gentler and skip "Move life forward" unless it's tiny. Match tone to: ${PERSONALITY_VOICE[state.companion.personality]}.${skipRate!=null && skipRate>0.5 ? ' They have been skipping more than half their recent items — make everything today noticeably smaller and easier than you normally would, only 2-3 items.' : ''}`,
    [{ role:'user', content: `Mood: ${mood}${selectedEmotion?` (specifically: ${selectedEmotion})`:''}. On their mind: ${mind || 'nothing specific shared'}. Known challenges: ${state.profile.challenges}. Known goals: ${state.profile.priorities}` }],
    true
  );
  let items;
  if(result && Array.isArray(result.items)){
    items = result.items.map(it=>({ id:uid(), label:it.label, title:it.title, status:'active' }));
  } else {
    items = [
      { id:uid(), label:'For you', title:'Make your favorite drink and sit somewhere quiet for 5 minutes', status:'active' },
      { id:uid(), label:'For your mind', title:'Write three sentences about how today actually feels', status:'active' },
      { id:uid(), label:'For someone else', title:'Send one message to someone you\'ve been meaning to reach', status:'active' }
    ];
  }
  state.dailyPlan = { date: todayStr(), items };
  saveState();
  render();
}

function togglePlanItem(id){
  const it = state.dailyPlan.items.find(x=>x.id===id);

  it.status = it.status==='done' ? 'active' : 'done';
  if(it.status==='done'){
    state.xp.Consistency += 6;
    state.completeLog.push(todayStr());
    markActive();
    earnShards(1);

    showToast('+6 Consistency');
    checkLevelUp();
  }

  render();
}
function skipPlanItem(id){

function conversationStarters(){
  const starters = [];
  if(state.profile.challenges) starters.push(`I want to talk about ${state.profile.challenges.split(',')[0].split('—')[0].trim().toLowerCase()}`);
  if(state.dailyCheckIn && state.dailyCheckIn.date===todayStr() && state.dailyCheckIn.emotion) starters.push(`I've been feeling ${state.dailyCheckIn.mind ? 'this way about something specific' : state.dailyCheckIn.emotion.toLowerCase()}`);
  starters.push('I want to think through a decision');

async function sendChat(text){
  const input = document.getElementById('chat-input');
  const msg = text || (input ? input.value.trim() : '');
  if(!msg || chatBusy) return;
  state.chat.push({ role:'user', content: msg });
  if(input) input.value='';

  if(isCrisisMessage(msg)){
    state.chat.push({ role:'assistant', content: crisisResponse() });
    markActive();
    saveState();
    render();
    return;
  }

  chatBusy = true;
  render();
  const history = state.chat.slice(-20).map(m=>({ role: m.role==='user'?'user':'assistant', content: m.content }));
  const reply = await callClaude(companionSystemPrompt(), history, false);
  state.chat.push({ role:'assistant', content: reply || "I'm having trouble finding words right now — try again in a moment?" });
  chatBusy = false;
  markActive();
  saveState();
  render();
  maybeSummarizeChat();
}
let questExtractBusy = false;
async function extractQuestsFromChat(){
  if(questExtractBusy || state.chat.length===0) return;
  questExtractBusy = true;
  render();
  const transcript = state.chat.slice(-16).map(m=>`${m.role==='user'?'User':'Companion'}: ${m.content}`).join('\n');
  const result = await callClaude(
    `Based on this conversation, extract 1 to 4 concrete, small, doable action steps that would genuinely help the user move forward. Respond with JSON: {"steps":[{"title":"...", "xpCategory":"one of Courage/Consistency/Growth/Connection/Adventure/Learning/Care/Creativity", "xpAmount": a number 6-15}]}. Titles must be specific and small — never vague. If there's truly nothing actionable in the conversation, return {"steps":[]}.`,
    [{ role:'user', content: transcript }],
    true
  );
  questExtractBusy = false;
  if(result && Array.isArray(result.steps) && result.steps.length){
    result.steps.forEach(s=> addQuest(s.title, 'daily', s.xpCategory||'Growth', s.xpAmount||10));
    saveState();
    showToast(`Added ${result.steps.length} quest${result.steps.length>1?'s':''}`);
  } else {
    showToast('Nothing concrete to add yet — keep talking it through.');
  }
  render();
}
async function maybeSummarizeChat(){
  if(state.chat.length < 16) return;
  const older = state.chat.slice(0, state.chat.length-10);
  if(older.length === 0) return;
  const transcript = older.map(m=>`${m.role==='user'?'User':'Companion'}: ${m.content}`).join('\n');
  const summary = await callClaude(
    `Summarize the lasting, useful points from this conversation in 2-4 short sentences — recurring themes, what the user cares about, commitments made, open threads. Write it as private notes for the companion to remember later, not as a message shown to the user.`,
    [{ role:'user', content: (state.chatSummary?`Existing notes: ${state.chatSummary}\n\n`:'') + `Conversation to fold in:\n${transcript}` }],
    false
  );
  if(summary){
    state.chatSummary = summary;
    state.chat = state.chat.slice(-10);
    saveState();
  }
}

function usePrompt(text){
  const el = document.getElementById('journal-input');

function handlePhotoFile(input){
  const file = input.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (ev)=>{
    const img = new Image();
    img.onload = ()=>{
      const maxW = 320;
      const scale = Math.min(1, maxW/img.width);
      const canvas = document.createElement('canvas');
      canvas.width = Math.round(img.width*scale);
      canvas.height = Math.round(img.height*scale);
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img,0,0,canvas.width,canvas.height);
      journalPhotoData = canvas.toDataURL('image/jpeg', 0.6);
      const prev = document.getElementById('photo-preview');
      if(prev) prev.innerHTML = `<img src="${journalPhotoData}" style="max-width:100%;border-radius:10px;">`;
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
}
function initDrawPad(){
  const canvas = document.getElementById('draw-pad');
  if(!canvas) return;
  drawCtx = canvas.getContext('2d');
  drawCtx.fillStyle = '#f2efe9';
  drawCtx.fillRect(0,0,canvas.width,canvas.height);
  drawCtx.strokeStyle = '#2a2440';
  drawCtx.lineWidth = 3;
  drawCtx.lineCap = 'round';
}
function drawPos(e, canvas){
  const rect = canvas.getBoundingClientRect();
  const cx = e.touches ? e.touches[0].clientX : e.clientX;
  const cy = e.touches ? e.touches[0].clientY : e.clientY;
  return { x:(cx-rect.left)*(canvas.width/rect.width), y:(cy-rect.top)*(canvas.height/rect.height) };
}
function drawStart(e){
  if(!drawCtx) return;
  isDrawing = true;
  const p = drawPos(e, e.target);
  drawCtx.beginPath(); drawCtx.moveTo(p.x,p.y);
  e.preventDefault();
}
function drawMove(e){
  if(!isDrawing || !drawCtx) return;
  const p = drawPos(e, e.target);
  drawCtx.lineTo(p.x,p.y); drawCtx.stroke();
  e.preventDefault();
}
function drawEnd(){ isDrawing = false; }
function clearDraw(){
  const canvas = document.getElementById('draw-pad');
  if(canvas && drawCtx){ drawCtx.fillStyle='#f2efe9'; drawCtx.fillRect(0,0,canvas.width,canvas.height); }
}

function growPlantSvg(){
  const lvl = levelInfo().lvl;
  const stage = Math.min(6, lvl-1); // 0..6
  const groundY = 168;
  let inner = `<ellipse cx="110" cy="${groundY+8}" rx="60" ry="9" fill="#1c2e22" opacity="0.5"/>`;
  if(stage===0){
    inner += `<circle cx="110" cy="${groundY}" r="4" fill="#8a5a3c"/>`;
  } else if(stage===1){
    inner += `<circle cx="110" cy="${groundY}" r="4" fill="#8a5a3c"/>
      <path d="M110 ${groundY} q-6 -10 -13 -7" stroke="#7fa88f" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      <path d="M110 ${groundY} q6 -13 13 -8" stroke="#7fa88f" stroke-width="3" fill="none" stroke-linecap="round"/>`;
  } else {
    const trunkH = [16,26,38,50,62][stage-2];
    const canopy = [14,20,28,36,44][stage-2];
    const topY = groundY - trunkH;
    inner += `<rect x="106" y="${topY}" width="8" height="${trunkH}" rx="3" fill="#5a4632"/>
      <circle cx="110" cy="${topY-canopy*0.5}" r="${canopy}" fill="#3a5a40"/>`;
    if(stage>=3) inner += `<circle cx="${110-canopy*0.7}" cy="${topY-canopy*0.15}" r="${canopy*0.62}" fill="#345a3c"/>
      <circle cx="${110+canopy*0.7}" cy="${topY-canopy*0.15}" r="${canopy*0.62}" fill="#345a3c"/>`;
    if(stage>=5) inner += `<circle cx="110" cy="${topY-canopy*1.15}" r="${canopy*0.55}" fill="#3f6446"/>`;
    if(stage>=6) inner += `<circle cx="88" cy="${topY-canopy*0.8}" r="4" fill="#e8a854"/><circle cx="134" cy="${topY-canopy*0.5}" r="4" fill="#e8a854"/><circle cx="110" cy="${topY-canopy*1.5}" r="4" fill="#e8a854"/>`;
  }
  return `<svg viewBox="0 0 220 190" style="width:100%;max-width:230px;display:block;margin:0 auto;">${inner}</svg>`;
}

  if(calmMode==='breathe' || calmMode==='silence'){
    calmSecondsLeft = 30;
  } else {
    calmSecondsLeft = Math.round(CALM_SEQUENCES[calmMode].reduce((a,s)=>a+s.ms,0)/1000);
  }
  render();

  if(calmMode==='breathe' && navigator.vibrate){
    try{ navigator.vibrate([180,3820,180,3820,180,3820,180]); }catch(e){}
  }
  if(CALM_SEQUENCES[calmMode]){
    const seq = CALM_SEQUENCES[calmMode];
    let i = 0;
    const showStep = ()=>{
      const el = document.getElementById('calm-prompt-text');
      if(el) el.textContent = seq[i].text;
      const dur = seq[i].ms;
      i++;
      if(i < seq.length) calmPromptTimer = setTimeout(showStep, dur);
    };
    calmPromptTimer = setTimeout(showStep, seq[0].ms);
  }
  calmTimer = setInterval(()=>{
    calmSecondsLeft--;
    const el = document.getElementById('calm-timer');
    if(el) el.textContent = calmSecondsLeft + 's';
    if(calmSecondsLeft<=0) endCalm();
  }, 1000);
}
function endCalm(){
  clearInterval(calmTimer); clearTimeout(calmPromptTimer);
  calmTimer = null; calmPromptTimer = null;
  calmActive = false;
  if(navigator.vibrate) try{ navigator.vibrate(0); }catch(e){}
  const el = document.getElementById('calm-screen');
  if(el){
    el.innerHTML = `<div class="card" style="text-align:center;padding:40px 22px;">
      <div class="serif" style="font-size:18px;margin-bottom:10px;">However that felt, that's alright.</div>
      <button class="btn ghost small" onclick="render()">Done</button>
    </div>`;
  }
}

/* ============ THOUGHT RECORD (CBT) ============ */
let trStep = 0;
let trData = {};
function openThoughtRecord(){
  trStep = 0;
  trData = { situation:'', thought:'', before:5, evFor:'', evAgainst:'', balanced:'', after:5 };
  const el = document.createElement('div');
  el.className = 'focus-overlay';
  el.id = 'tr-overlay';
  document.body.appendChild(el);
  mountThoughtRecord();
}
function mountThoughtRecord(){
  const el = document.getElementById('tr-overlay');
  if(el) el.innerHTML = trStepHTML();
}
function trDots(){
  return Array.from({length:5}).map((_,i)=>`<span class="${i===trStep?'active':''}"></span>`).join('');
}
function trStepHTML(){
  if(trStep===0){
    return `<div class="focus-dots">${trDots()}</div>
    <div class="focus-step" style="justify-content:flex-start;padding-top:10px;text-align:left;">
      <div class="serif" style="font-size:17px;margin-bottom:6px;">What happened?</div>
      <div class="muted" style="margin-bottom:12px;">Just the facts — where you were, what was said or done.</div>
      <textarea id="tr-situation" rows="2" placeholder="The situation...">${escapeHtml(trData.situation)}</textarea>
      <div class="serif" style="font-size:17px;margin:16px 0 6px;">What went through your mind?</div>
      <div class="muted" style="margin-bottom:10px;">The thought that showed up, as exactly as you remember it.</div>
      <textarea id="tr-thought" rows="2" placeholder="The automatic thought...">${escapeHtml(trData.thought)}</textarea>
    </div>
    <button class="btn" onclick="trNext(0)">Next</button>
    <button class="btn ghost small" style="margin-top:10px;" onclick="closeThoughtRecord()">Close</button>`;
  }
  if(trStep===1){
    return `<div class="focus-dots">${trDots()}</div>
    <div class="focus-step">
      <div class="serif" style="font-size:17px;margin-bottom:14px;">How strong is that feeling right now?</div>
      <input type="range" min="0" max="10" value="${trData.before}" id="tr-before" oninput="document.getElementById('tr-before-val').textContent=this.value">
      <div class="muted" style="margin-top:8px;">Intensity: <span id="tr-before-val">${trData.before}</span>/10</div>
    </div>
    <button class="btn" onclick="trNext(1)">Next</button>`;
  }
  if(trStep===2){
    return `<div class="focus-dots">${trDots()}</div>
    <div class="focus-step" style="justify-content:flex-start;padding-top:10px;text-align:left;">
      <div class="serif" style="font-size:17px;margin-bottom:6px;">What's the evidence?</div>
      <div class="muted" style="margin-bottom:10px;">For the thought — what makes it feel true?</div>
      <textarea id="tr-evfor" rows="2" placeholder="Evidence for...">${escapeHtml(trData.evFor)}</textarea>
      <div class="muted" style="margin:14px 0 10px;">Against it — what doesn't quite fit, or what you'd tell a friend thinking this?</div>
      <textarea id="tr-evagainst" rows="2" placeholder="Evidence against...">${escapeHtml(trData.evAgainst)}</textarea>
    </div>
    <button class="btn" onclick="trNext(2)">Next</button>`;
  }
  if(trStep===3){
    return `<div class="focus-dots">${trDots()}</div>
    <div class="focus-step" style="justify-content:flex-start;padding-top:10px;text-align:left;">
      <div class="serif" style="font-size:17px;margin-bottom:6px;">Given all that, what's a more balanced thought?</div>
      <div class="muted" style="margin-bottom:10px;">Not forced positivity — just something that actually fits the evidence better.</div>
      <textarea id="tr-balanced" rows="3" placeholder="A more balanced way to see it...">${escapeHtml(trData.balanced)}</textarea>
    </div>
    <button class="btn" onclick="trNext(3)">Next</button>`;
  }
  return `<div class="focus-dots">${trDots()}</div>
  <div class="focus-step">
    <div class="serif" style="font-size:17px;margin-bottom:14px;">And now?</div>
    <input type="range" min="0" max="10" value="${trData.after}" id="tr-after" oninput="document.getElementById('tr-after-val').textContent=this.value">
    <div class="muted" style="margin-top:8px;">Intensity: <span id="tr-after-val">${trData.after}</span>/10</div>
  </div>
  <button class="btn sage" onclick="trFinish()">Save & close</button>`;
}
function trNext(fromStep){
  if(fromStep===0){
    trData.situation = (document.getElementById('tr-situation')||{}).value || '';
    trData.thought = (document.getElementById('tr-thought')||{}).value || '';
  }
  if(fromStep===1){ trData.before = parseInt((document.getElementById('tr-before')||{}).value || 5, 10); }
  if(fromStep===2){
    trData.evFor = (document.getElementById('tr-evfor')||{}).value || '';
    trData.evAgainst = (document.getElementById('tr-evagainst')||{}).value || '';
  }
  if(fromStep===3){ trData.balanced = (document.getElementById('tr-balanced')||{}).value || ''; }
  trStep++;
  mountThoughtRecord();
}
function trFinish(){
  trData.after = parseInt((document.getElementById('tr-after')||{}).value || 5, 10);
  const text = `Situation: ${trData.situation}\nThought: ${trData.thought}\nEvidence for: ${trData.evFor}\nEvidence against: ${trData.evAgainst}\nBalanced thought: ${trData.balanced}\nIntensity: ${trData.before}/10 → ${trData.after}/10`;
  state.journal.push({ id:uid(), date:todayStr(), text, category:'difficult' });
  state.xp.Growth += 8;
  earnShards(2);
  markActive();
  saveState();
  closeThoughtRecord();
  showToast('Saved to your journal');
}
function closeThoughtRecord(){
  const el = document.getElementById('tr-overlay');
  if(el) el.remove();
}

/* ============ GARDEN ============ */
function renderGarden(){
  const slots = gardenSlotCount();
  while(state.garden.length < slots) state.garden.push(null);
  const ownedList = COLLECTIBLES.filter(c => (state.inventory.items[c.id]||0) > 0);
  renderShell(`
    <div class="topbar"><h2 style="margin:0;font-size:16.5px;">Garden</h2><div></div></div>
    <div class="screen">
      <div class="shard-bar">
        <div class="shard-pill">✦ <span id="shard-count">${state.inventory.shards}</span> shards</div>
        <div class="muted" style="font-size:12.5px;">digs left today: <span id="dig-count">${freeDigsRemaining()}</span></div>
      </div>
      <div class="dig-plot">
        <div class="muted" style="margin-bottom:14px;">A quiet spot to dig. No rush, nothing to lose.</div>
        <div class="dig-result" id="dig-result"></div>
        <button class="btn ${canDig()?'':'ghost'}" onclick="doDig()" ${canDig()?'':'disabled'}>${freeDigsRemaining()>0 ? 'Dig' : 'Dig (3 shards)'}</button>
        ${!canDig() ? `<div class="muted" style="margin-top:10px;font-size:12px;">Complete something today to earn more shards.</div>` : ''}
      </div>

      ${renderPuzzleCard()}

      <div class="card">
        <h3>Your display wall</h3>
        <div class="muted" style="margin-bottom:6px;">Tap an empty frame to hang something. Tap a filled one to take it down.</div>
        <div class="garden-grid">
          ${state.garden.slice(0,slots).map((itemId,i)=>{
            const c = itemId ? collectibleById(itemId) : null;
            return `<div class="garden-tile" onclick="openSlotPicker(${i})">${c?`<span class="glyph" style="color:${c.color}">${c.glyph}</span>`:''}</div>`;
          }).join('')}
        </div>
        <div class="muted" style="text-align:center;margin-top:2px;">More frames open as you level up.</div>
      </div>

      <div class="card">
        <h3>Trophy cabinet</h3>
        <div class="muted" style="margin-bottom:4px;">Tap something you've found for options.</div>
        ${ownedList.length===0 ? `<div class="empty"><div class="serif">Nothing yet.</div>Dig to find your first little thing.</div>` : `
        <div class="shelf" style="border-bottom-color:#3c2f21;">
          ${ownedList.map(c=>`<div class="book-spine" style="width:56px;height:64px;background:none;box-shadow:none;flex-direction:column;justify-content:flex-end;" onclick="openTrophy('${c.id}')">
            <span style="font-size:26px;color:${c.color};">${c.glyph}</span>
            <span style="font-size:9px;color:${RARITY_COLORS[c.rarity]};text-transform:uppercase;letter-spacing:.3px;margin-top:2px;">${c.rarity}</span>
            <span style="font-size:10px;color:var(--muted);">×${state.inventory.items[c.id]}</span>
          </div>`).join('')}
        </div>`}
      </div>
    </div>
    ${gardenPickerSlot!=null ? renderPicker() : ''}
  `);
}
function renderPicker(){
  const available = COLLECTIBLES.filter(c=>ownedAvailable(c.id)>0);
  return `
  <div class="picker-overlay" onclick="if(event.target===this) closePicker()">
    <div class="picker-sheet">
      <h3 style="margin-top:0;">Place something here</h3>
      ${available.length===0 ? `<div class="muted" style="margin-bottom:14px;">Nothing free to place — dig to find more.</div>` : `
      <div class="inv-row">
        ${available.map(c=>`<div class="inv-item" onclick="placeItem('${c.id}')"><span class="glyph" style="color:${c.color}">${c.glyph}</span>${c.name}<div class="count" style="color:${RARITY_COLORS[c.rarity]};">${c.rarity}</div></div>`).join('')}
      </div>`}
      <button class="btn ghost small" style="margin-top:8px;" onclick="closePicker()">Close</button>
    </div>
  </div>`;
}

/* ============ PROFILE ============ */
function renderProfile(){
  const li = levelInfo();
  renderShell(`
    <div class="topbar"><h2 style="margin:0;font-size:16.5px;">Profile</h2><div></div></div>
    <div class="screen">
      <div class="card">
        <h3>${escapeHtml(state.profile.name)}</h3>
        <div class="muted">Level ${li.lvl} · ${li.name} · ${totalXP()} total xp</div>
      </div>
      <div class="card">
        <h3>Companion</h3>
        <div style="text-align:center;margin-bottom:14px;">
          <svg viewBox="0 0 60 60" style="width:70px;height:70px;">${avatarMarkup(30,30,1.6)}</svg>
        </div>
        <div class="muted" style="margin-bottom:8px;">Name</div>
        <input type="text" id="comp-name" value="${escapeHtml(state.companion.name)}" style="margin-bottom:14px;">
        <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:14px;">
          <div>
            <div class="muted" style="margin-bottom:6px;font-size:11.5px;">Color</div>
            <select onchange="setAvatar('color',this.value)">
              ${Object.keys(AVATAR_COLORS).map(c=>`<option value="${c}" ${state.companion.avatar.color===c?'selected':''}>${c}</option>`).join('')}
            </select>
          </div>
          <div>
            <div class="muted" style="margin-bottom:6px;font-size:11.5px;">Pet</div>
            <select onchange="setAvatar('species',this.value)">
              ${Object.entries(PET_TYPES).map(([id,p])=>`<option value="${id}" ${state.companion.avatar.species===id?'selected':''}>${p.label}</option>`).join('')}
            </select>
          </div>
          <div>
            <div class="muted" style="margin-bottom:6px;font-size:11.5px;">Accessory</div>
            <select onchange="setAvatar('accessory',this.value)">
              ${['none','glasses','bow','star','flower','scarf','crown'].map(a=>`<option value="${a}" ${state.companion.avatar.accessory===a?'selected':''}>${a}</option>`).join('')}
            </select>
          </div>
        </div>
        <div class="muted" style="margin-bottom:8px;">Personality</div>
        <div class="row" style="margin-bottom:14px;">
          ${Object.keys(PERSONALITY_VOICE).map(p=>`<span class="chip ${state.companion.personality===p?'selected':''}" onclick="setCompanion('personality','${p}')">${p}</span>`).join('')}
        </div>
        <div class="muted" style="margin-bottom:8px;">Communication</div>
        <div class="row" style="margin-bottom:14px;">
          ${Object.keys(COMM_STYLE).map(p=>`<span class="chip ${state.companion.communication===p?'selected':''}" onclick="setCompanion('communication','${p}')">${p}</span>`).join('')}
        </div>
        <button class="btn small" onclick="saveCompanionName()">Save name</button>
      </div>
      <div class="card">
        <h3>What I remember</h3>
        <div class="muted" style="margin-bottom:6px;"><strong style="color:var(--text)">Brought you here:</strong> ${escapeHtml(state.profile.priorities)||'—'}</div>
        <div class="muted" style="margin-bottom:6px;"><strong style="color:var(--text)">Feels difficult:</strong> ${escapeHtml(state.profile.challenges)||'—'}</div>
        <div class="muted" style="margin-bottom:12px;"><strong style="color:var(--text)">Going well:</strong> ${escapeHtml(state.profile.goodThings)||'—'}</div>
        <button class="btn ghost small" onclick="clearMemory()">Clear this memory</button>
      </div>
      <div class="card">
        <h3>Feel & settings</h3>
        <div class="settings-row">
          <span>Sound effects</span>
          <div class="switch ${state.settings.sound?'on':''}" onclick="toggleSetting('sound')"></div>
        </div>
        <div class="settings-row">
          <span>Ambient music</span>
          <div class="switch ${state.settings.music?'on':''}" onclick="toggleMusic()"></div>
        </div>
        <div class="settings-row">
          <span>Morning nudge</span>
          <div class="switch ${state.settings.notifyMorning?'on':''}" onclick="toggleSetting('notifyMorning')"></div>
        </div>
        <div class="settings-row">
          <span>Evening nudge</span>
          <div class="switch ${state.settings.notifyEvening?'on':''}" onclick="toggleSetting('notifyEvening')"></div>
        </div>
        <div class="muted" style="margin-top:10px;line-height:1.5;">Nudges appear as a banner when you open Aster around that time of day. Real push notifications while the app is closed need a phone app or browser install — worth knowing this is the honest version until then.</div>
        <div class="muted" style="margin-top:12px;">Home screen: <strong style="color:var(--text)">${SPACES.find(s=>s.id===state.settings.defaultSpace)?.name || 'Room'}</strong>. Visit any unlocked space and tap "set as home" to change it.</div>
        <div style="margin-top:12px;"><a class="link" onclick="openTutorial()">Replay the tutorial</a></div>
      </div>
      <div class="card">
        <h3>AI companion (advanced)</h3>
        <div class="muted" style="margin-bottom:10px;line-height:1.5;">Talk, daily plans, and quest suggestions need an AI connection. If this copy of Aster is hosted outside Claude.ai (like on GitHub Pages), there's no connection built in — you can add your own Anthropic API key below to turn those features on for yourself.</div>
        <div class="muted" style="margin-bottom:10px;line-height:1.5;">Everything else — quests, journal, Garden, and every tool in Calm including the ones for panic and overwhelm — already works fully without this, on any device, for free.</div>
        <input type="password" id="api-key-input" placeholder="sk-ant-..." value="${escapeHtml(state.settings.apiKey||'')}" style="margin-bottom:10px;">
        <div class="row" style="margin-bottom:10px;">
          <button class="btn small" onclick="saveApiKey()">Save key</button>
          ${state.settings.apiKey ? `<button class="btn ghost small" onclick="clearApiKey()">Remove key</button>` : ''}
        </div>
        <div class="muted" style="font-size:11.5px;line-height:1.5;">This is stored only in this browser, on this device — never sent anywhere except directly to Anthropic when you use Talk. Anyone with access to this device could see it in the browser's developer tools, and each message will use your Anthropic account's usage and may incur cost. Get a key at <span style="color:var(--text);">console.anthropic.com</span>.</div>
      </div>
      <div class="card">
        <h3>Reset</h3>
        <div class="muted" style="margin-bottom:10px;">Start completely over — clears everything.</div>
        <button class="btn ghost small" onclick="resetApp()" style="border-color:var(--danger);color:var(--danger);">Reset Aster</button>
      </div>
    </div>
  `);
}
function saveApiKey(){
  const val = document.getElementById('api-key-input').value.trim();
  state.settings.apiKey = val;
  saveState();
  showToast(val ? 'Key saved on this device' : 'Key cleared');
  render();
}
function clearApiKey(){
  state.settings.apiKey = '';
  saveState();
  render();
}
function setCompanion(key,val){ state.companion[key]=val; saveState(); render(); }
function setAvatar(key,val){ state.companion.avatar[key]=val; saveState(); render(); }
function toggleSetting(key){ state.settings[key] = !state.settings[key]; saveState(); render(); }
function saveCompanionName(){
  state.companion.name = document.getElementById('comp-name').value.trim() || state.companion.name;
  saveState(); render();
}
function clearMemory(){
  state.profile.priorities=''; state.profile.challenges=''; state.profile.goodThings='';
  saveState(); render();
}
async function resetApp(){
  state = defaultState();
  currentScreen='home';
  await saveState();
  render();
}

/* ============ INIT ============ */
window.addEventListener('DOMContentLoaded', async ()=>{
  await loadState();
  markActive();
  render();
});
</script>
</body>
</html>
